# `docker compose up --build` serves the whole application on http://localhost:8080
# The app container holds both the API and the compiled React frontend.
services:
  db:
    image: postgres:17-alpine
    container_name: mes-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes}
      POSTGRES_DB: ${POSTGRES_DB:-mes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published only so a GUI client can reach it. 5433 by default, because
      # 5432 is usually taken by another Postgres already on the machine. The
      # app container does not use this: it reaches db:5432 over the network.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mes} -d ${POSTGRES_DB:-mes}']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      # Root context: the image builds the frontend and the backend together.
      context: .
      dockerfile: Dockerfile
    container_name: mes-app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mes}:${POSTGRES_PASSWORD:-mes}@db:5432/${POSTGRES_DB:-mes}
      # Same origin serves the UI and the API, so CORS only matters for `npm run dev`.
      CORS_ORIGINS: http://localhost:5173
      AUTO_CREATE_TABLES: 'true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8000'
    # Seeds on first boot, then serves. The seed is a no-op once data exists.
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  pgdata:
